    <div class="table-scroll">
      <table>
        <tr><th>周日程</th><td>按星期和上午、下午查看任务，支持切换周次。</td></tr>
        <tr><th>添加任务</th><td>点击日程表对应区域添加，点击任务内容编辑。</td></tr>
        <tr><th>完成任务</th><td>勾选后收进回收站，可恢复或清空。</td></tr>
        <tr><th>任务颜色</th><td>常用色块和自定义调色盘。</td></tr>
        <tr><th>每周循环</th><td>每周同一时间重复，完成状态按周分别保存。</td></tr>
        <tr><th>通知提醒</th><td>开启通知权限，设置提醒时间，在下拉通知栏接收提醒。</td></tr>
